<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Chuna Results Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 360px;
      text-align: center;
    }

    .login-container h2 {
      color: #007BFF;
      margin-bottom: 20px;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #007BFF;
      color: #fff;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .login-container button:hover {
      background: #0056b3;
    }

    .login-container a {
      display: block;
      margin-top: 12px;
      color: #007BFF;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .login-container a:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      color: red;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #fff;
      padding: 25px 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
      position: relative;
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #007BFF;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .modal-content button {
      width: 100%;
      padding: 10px;
      border: none;
      background: #007BFF;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-content button:hover {
      background: #0056b3;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 18px;
      cursor: pointer;
      color: #555;
    }

    @media(max-width: 400px){
      .login-container, .modal-content { width: 90%; padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <a href="#" id="forgotPasswordLink">Forgot Password?</a>
    <p class="message" id="message"></p>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal" id="forgotModal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal">&times;</span>
      <h3>Reset Password</h3>
      <input type="email" id="resetEmail" placeholder="Enter your email" required>
      <button id="sendResetBtn">Send Reset Link</button>
      <p class="message" id="resetMessage"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBDgZDx_wwWfUBHYc8KeU7_5bac2kdvZCo",
      authDomain: "chuna-results-portal-2026.firebaseapp.com",
      projectId: "chuna-results-portal-2026",
      storageBucket: "chuna-results-portal-2026.firebasestorage.app",
      messagingSenderId: "548114778247",
      appId: "1:548114778247:web:40081809bcca49f1019022"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();

    const loginForm = document.getElementById("loginForm");
    const messageEl = document.getElementById("message");
    const forgotPasswordLink = document.getElementById("forgotPasswordLink");
    const forgotModal = document.getElementById("forgotModal");
    const closeModal = document.getElementById("closeModal");
    const sendResetBtn = document.getElementById("sendResetBtn");
    const resetEmailInput = document.getElementById("resetEmail");
    const resetMessage = document.getElementById("resetMessage");

    // Login
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        messageEl.textContent = "Please enter email and password.";
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        const q = query(collection(db, "admins"), where("uid", "==", uid));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          messageEl.textContent = "You are not authorized as an admin!";
          await auth.signOut();
          return;
        }

        messageEl.style.color = "green";
        messageEl.textContent = "Login successful! Redirecting...";
        setTimeout(() => {
        window.location.href = "/admin/dashboard.html";
        }, 1000);

      } catch (err) {
        console.error(err);
        messageEl.textContent = "Login failed: " + err.message;
      }
    });

    // Open modal
    forgotPasswordLink.addEventListener("click", () => {
      resetEmailInput.value = "";
      resetMessage.textContent = "";
      forgotModal.style.display = "flex";
    });

    // Close modal
    closeModal.addEventListener("click", () => {
      forgotModal.style.display = "none";
    });

    // Send password reset email
    sendResetBtn.addEventListener("click", async () => {
      const email = resetEmailInput.value.trim();
      if (!email) {
        resetMessage.textContent = "Enter your email first.";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        resetMessage.style.color = "green";
        resetMessage.textContent = "Reset link sent! Check your inbox.";
      } catch (err) {
        resetMessage.style.color = "red";
        resetMessage.textContent = "Failed: " + err.message;
      }
    });

    // Close modal when clicking outside
    window.addEventListener("click", (e) => {
      if (e.target === forgotModal) forgotModal.style.display = "none";
    });
  </script>

</body>
</html>
